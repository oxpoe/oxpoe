name: snake

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: oxpoe
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23c77dff&color_dots=%23161022,%232a1152,%236b3fa0,%237cffcb,%23c77dff
            dist/snake.gif?palette=github-dark
      - uses: actions/checkout@v4
        with:
          ref: output
          path: out
      - name: Commit snake ke branch output
        run: |
          cp -f dist/* out/
          cd out
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.gitea"
          git add -A
          git commit -m "snake: update" || { echo "tidak ada perubahan"; exit 0; }
          git push
